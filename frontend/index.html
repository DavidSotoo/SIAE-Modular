<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIAE-Modular - Portal de Estudiantes</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Aplica el tema antes del primer pintado para evitar el parpadeo. Es un
       archivo y no un script en linea porque la CSP no permite estos ultimos.
       La CSP misma la inyecta vite.config.ts al inicio del <head>. -->
  <script src="/tema-inicial.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido</a>
  <div id="app" class="app-layout">
    <div id="sidebar-container"></div>
    <div id="topbar-container"></div>
    <main class="main-content" id="main-content" tabindex="-1"></main>
  </div>
  <!-- Region live persistente: existe desde el arranque para que el lector de
       pantalla anuncie de forma fiable los avisos que se insertan aqui. -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
