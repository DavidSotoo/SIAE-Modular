<!DOCTYPE html><html class="h-full" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Iniciar sesión - Portal CUCEI | UdeG</title>
<!-- Google Fonts: Inter & Roboto -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto:wght@400;500&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Roboto', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
          },
          colors: {
            google: {
              blue: '#1a73e8',
              'blue-hover': '#1557b0',
              'blue-active': '#174ea6',
              'surface': '#f8fafd',
              'border': '#dadce0',
              'text-primary': '#202124',
              'text-secondary': '#5f6368',
            },
            cucei: {
              navy: '#0b2046',
              accent: '#1e4b8a'
            }
          },
          boxShadow: {
            'google-card': '0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15)',
            'm3-elevation': '0 4px 20px -2px rgba(17, 24, 39, 0.08), 0 2px 6px -1px rgba(17, 24, 39, 0.04)',
          }
        }
      }
    }
  </script>
<!-- Custom CSS for Form & Material Accents -->
<style data-purpose="custom-styling">
    body {
      background-color: #f0f4f9;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(26, 115, 232, 0.035) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(11, 32, 70, 0.03) 0%, transparent 45%);
    }

    .form-input-m3 {
      transition: border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .form-input-m3:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 1.5px #1a73e8;
    }
  </style>
</head>
<body class="min-h-full flex flex-col justify-between text-google-text-primary antialiased font-sans p-4 sm:p-6 md:p-8">
<!-- BEGIN: TopBar -->
<header class="w-full max-w-6xl mx-auto flex items-center justify-between py-2 px-1" data-purpose="header-navigation">
<div class="flex items-center space-x-2.5">
<!-- CUCEI Institutional Logo / Modern Monogram -->
<div class="flex items-center justify-center">
  <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDjYcY0-KnrFkJGFrASeaIVzbyuai9lTwsAh9dOV0y3MrYSq-MbSMS6By2cbZM8bByAwJ1VqwpWYYVks4r31ID6B9HfgEzh6olPIZMSR9sqjOQ3qGfO303FosaDBc6Z6aXT0e8zKlmJvYPg1DYkoJaaXxb02eWkTiz5g8aT7HtA0vGMneDTIM6IX8pmtbHyI8poTCg8H905QOQa1EOXb5syg89D8EXRtyda_gQwYXph-Np7Jp1PHGUPEQ_ssfSslrEyHA" alt="Logo UdeG" class="h-8 w-auto object-contain">
</div>
<div>
<span class="text-sm font-semibold tracking-tight text-cucei-navy block leading-none">CUCEI</span>
<span class="text-[10px] text-google-text-secondary tracking-wider uppercase font-medium">Universidad de Guadalajara</span>
</div>
</div>
<!-- Direct Support Badge -->
<a class="text-xs font-medium text-google-text-secondary hover:text-google-blue transition-colors px-3 py-1.5 rounded-full hover:bg-white/60" href="#ayuda">
      Ayuda y soporte
    </a>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<main class="flex-grow flex items-center justify-center my-6 sm:my-8" data-purpose="login-container">
<div class="w-full max-w-[448px] bg-white rounded-3xl border border-gray-200/75 shadow-m3-elevation px-7 py-9 sm:px-10 sm:py-11 transition-all">
<!-- Logo and Header -->
<div class="text-center mb-8">
<!-- Modern SVG Emblem -->
<div class="mx-auto flex items-center justify-center mb-5">
  <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAr3jCUlsUzPBOGY1J8x9c6xyq81SFu7Rb4tOzGz1H_ybkPh1Oqaqq1Cv_pLcYW1kpFXaZ98dVTtZ-7ZC3tMCtvPkHQBympN3fwZssmI4I6qx4Clua0HqOrBlO7ZjKAldMxyjsIOlOfLlD5Vkrd6uj96MAXENOvUS6_bdhlAPkNECUZgVNoP0RmRBuX8CXSlPKR6IYQfD68SMefDsRenbeo68VEAAl39s8GaWST89jFkJg5YfiSSLltgFwgfXoQmt-Ouw" alt="Escudo Universidad de Guadalajara" class="h-16 w-auto object-contain">
</div>
<h1 class="text-2xl font-normal tracking-tight text-google-text-primary">
          Iniciar sesión
        </h1>
<p class="text-sm text-google-text-secondary mt-2 leading-relaxed">
          Ingresa tus credenciales institucionales de CUCEI para acceder a tu cuenta
        </p>
</div>
<!-- Login Form -->
<form autocomplete="on" class="space-y-5" id="loginForm" onsubmit="return false;">
<!-- Input: Código CUCEI -->
<div class="space-y-1.5">
<label class="block text-xs font-medium text-google-text-secondary px-0.5" for="studentCode">
            Código CUCEI
          </label>
<div class="relative">
<input class="form-input-m3 block w-full rounded-xl border border-gray-300 bg-transparent px-3.5 py-3 text-sm text-google-text-primary placeholder:text-gray-400 focus:outline-none" id="studentCode" inputmode="numeric" name="studentCode" pattern="[0-9]*" placeholder="Ej. 220000001" required="" type="text" value="220000001">
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
</div>
</div>
<!-- Input: Contraseña -->
<div class="space-y-1.5">
<div class="flex items-center justify-between px-0.5">
<label class="block text-xs font-medium text-google-text-secondary" for="password">
              Contraseña
            </label>
<a class="text-xs font-medium text-google-blue hover:text-google-blue-hover hover:underline transition-colors" href="#olvide-contrasena">
              ¿Olvidaste tu contraseña?
            </a>
</div>
<div class="relative">
<input class="form-input-m3 block w-full rounded-xl border border-gray-300 bg-transparent px-3.5 py-3 pr-10 text-sm text-google-text-primary placeholder:text-gray-400 focus:outline-none" id="password" name="password" placeholder="Ingresa tu contraseña" required="" type="password" value="secretPassword123">
<!-- Toggle password visibility button -->
<button aria-label="Mostrar u ocultar contraseña" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-google-text-secondary focus:outline-none transition-colors" id="togglePassword" type="button">
<svg class="w-5 h-5" fill="none" id="eyeIcon" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
</div>
<!-- Remember device option -->
<div class="flex items-center pt-0.5">
<input class="h-4 w-4 rounded border-gray-300 text-google-blue focus:ring-google-blue focus:ring-offset-0 transition" id="rememberMe" name="rememberMe" type="checkbox">
<label class="ml-2.5 block text-xs text-google-text-secondary select-none cursor-pointer" for="rememberMe">
            Recordar en este equipo
          </label>
</div>
<!-- Action Buttons -->
<div class="pt-4 flex flex-col sm:flex-row-reverse sm:items-center sm:justify-between gap-3">
<button class="w-full sm:w-auto min-w-[120px] inline-flex justify-center items-center px-6 py-2.5 bg-google-blue hover:bg-google-blue-hover active:bg-google-blue-active text-white text-sm font-medium rounded-full shadow-sm hover:shadow transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-google-blue focus:ring-offset-2" type="submit">
            Siguiente
          </button>
<a class="inline-flex justify-center sm:justify-start items-center text-xs font-medium text-google-blue hover:text-google-blue-hover py-2 px-1 hover:underline transition-colors" href="#crear-cuenta">
            ¿Problemas para ingresar?
          </a>
</div>
</form>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: Footer -->
<footer class="w-full max-w-6xl mx-auto pt-4 pb-2" data-purpose="site-footer">
<div class="flex flex-col sm:flex-row items-center justify-between text-xs text-google-text-secondary gap-3 sm:gap-4 px-2">
<!-- Language Selector (Material minimal) -->
<div class="flex items-center space-x-1">
<select aria-label="Seleccionar idioma" class="bg-transparent text-xs text-google-text-secondary border-none py-1 pl-1 pr-6 focus:ring-0 focus:outline-none cursor-pointer hover:text-google-text-primary rounded">
<option selected="" value="es">Español (México)</option>
<option value="en">English (United States)</option>
</select>
</div>
<!-- Legal and Info Links -->
<div class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2">
<a class="hover:text-google-text-primary transition-colors" href="#ayuda">Ayuda</a>
<a class="hover:text-google-text-primary transition-colors" href="#privacidad">Privacidad</a>
<a class="hover:text-google-text-primary transition-colors" href="#condiciones">Términos</a>
<span aria-hidden="true" class="text-gray-300 hidden sm:inline">•</span>
<span class="text-[11px] text-gray-400">© CUCEI Universidad de Guadalajara</span>
</div>
</div>
</footer>
<!-- END: Footer -->
<!-- Toggle Password Interactivity Script -->
<script data-purpose="password-visibility">
    document.addEventListener('DOMContentLoaded', function () {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', function () {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          
          if (isPassword) {
            // Icon for "hide" password
            eyeIcon.innerHTML = `
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            `;
          } else {
            // Icon for "show" password
            eyeIcon.innerHTML = `
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            `;
          }
        });
      }
    });
  </script>


</body></html>
